<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-join" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Two people joining -->
  <circle cx="100" cy="120" r="50" fill="url(#grad-join)"/>
  <rect x="60" y="180" width="80" height="80" rx="10" fill="url(#grad-join)"/>
  
  <circle cx="200" cy="120" r="50" fill="url(#grad-join)" opacity="0.7"/>
  <rect x="160" y="180" width="80" height="80" rx="10" fill="url(#grad-join)" opacity="0.7"/>
  
  <!-- Handshake/connection -->
  <path d="M 140 200 L 160 200" stroke="white" stroke-width="10" stroke-linecap="round"/>
</svg>
