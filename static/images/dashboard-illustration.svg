<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-dash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Dashboard card -->
  <rect x="50" y="50" width="400" height="300" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="70" y="70" width="360" height="40" rx="10" fill="url(#grad-dash)"/>
  
  <!-- Stats boxes -->
  <rect x="70" y="130" width="100" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="190" y="130" width="100" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="310" y="130" width="100" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  
  <!-- Chart area -->
  <rect x="70" y="230" width="340" height="100" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  
  <!-- Chart bars -->
  <rect x="90" y="260" width="30" height="50" fill="url(#grad-dash)"/>
  <rect x="140" y="250" width="30" height="60" fill="url(#grad-dash)"/>
  <rect x="190" y="270" width="30" height="40" fill="url(#grad-dash)"/>
  <rect x="240" y="240" width="30" height="70" fill="url(#grad-dash)"/>
  <rect x="290" y="255" width="30" height="55" fill="url(#grad-dash)"/>
  <rect x="340" y="265" width="30" height="45" fill="url(#grad-dash)"/>
</svg>
