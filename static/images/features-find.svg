<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-find" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Magnifying glass -->
  <circle cx="150" cy="120" r="80" stroke="url(#grad-find)" stroke-width="15" fill="none"/>
  <line x1="210" y1="180" x2="260" y2="230" stroke="url(#grad-find)" stroke-width="15" stroke-linecap="round"/>
  
  <!-- Person icon inside -->
  <circle cx="150" cy="100" r="30" fill="url(#grad-find)"/>
  <rect x="120" y="140" width="60" height="40" rx="10" fill="url(#grad-find)"/>
</svg>
