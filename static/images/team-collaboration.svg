<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-team" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Person 1 -->
  <circle cx="100" cy="100" r="40" fill="url(#grad-team)"/>
  <rect x="60" y="150" width="80" height="100" rx="10" fill="url(#grad-team)"/>
  
  <!-- Person 2 -->
  <circle cx="200" cy="80" r="40" fill="#f093fb"/>
  <rect x="160" y="130" width="80" height="120" rx="10" fill="#f093fb"/>
  
  <!-- Person 3 -->
  <circle cx="300" cy="100" r="40" fill="#4facfe"/>
  <rect x="260" y="150" width="80" height="100" rx="10" fill="#4facfe"/>
  
  <!-- Connection lines -->
  <line x1="140" y1="200" x2="160" y2="180" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="200" x2="260" y2="200" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
