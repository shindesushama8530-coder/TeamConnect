<!DOCTYPE html>
<html>

<head>

    <title>My Profile - TeamConnect</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .navbar {
            background-color: #2563eb;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .container {
            width: 700px;
            margin: 40px auto;
        }

        .profile-card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .profile-card h1 {
            margin-top: 0;
            color: #2563eb;
        }

        .info {
            margin: 15px 0;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

    </style>

</head>


<body>

<div class="navbar">

    <h2>TeamConnect</h2>

    <a href="/dashboard">Dashboard</a>

</div>


<div class="container">

    <div class="profile-card">

        <h1>My Profile</h1>

        <div class="info">
            <span class="label">Name:</span>
            {{ user[0] }}
        </div>

        <div class="info">
            <span class="label">Email:</span>
            {{ user[1] }}
        </div>

        <div class="info">
            <span class="label">Department:</span>
            {{ user[2] }}
        </div>

        <div class="info">
            <span class="label">Year:</span>
            {{ user[3] }}
        </div>

        <div class="info">
            <span class="label">Skills:</span>
            {{ user[4] }}
        </div>

        <div class="info">
            <span class="label">Interests:</span>
            {{ user[5] or "Not added" }}
        </div>

        <div class="info">
            <span class="label">Bio:</span>
            {{ user[6] or "Not added" }}
        </div>

        <a href="/dashboard" class="back-btn">
            Back to Dashboard
        </a>

    </div>

</div>

</body>

</html>
