<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - TeamConnect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .navbar {
            background: white;
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            color: #667eea;
            font-size: 24px;
        }

        .navbar a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .profile-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-item {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .info-item.full-width {
            grid-column: 1 / -1;
        }

        .label {
            display: block;
            font-weight: 600;
            color: #667eea;
            font-size: 13px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value {
            color: #333;
            font-size: 16px;
            line-height: 1.5;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .edit-btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .edit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        @media (max-width: 600px) {
            .button-group {
                flex-direction: column;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>🚀 TeamConnect</h2>
    <a href="/dashboard">Back to Dashboard</a>
</div>

<div class="container">
    <div class="profile-card">
        <div class="profile-header">
            <div class="profile-avatar">👤</div>
            <h1>{{ user[0] }}</h1>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <span class="label">Email</span>
                <div class="value">{{ user[1] }}</div>
            </div>

            <div class="info-item">
                <span class="label">Department</span>
                <div class="value">{{ user[2] }}</div>
            </div>

            <div class="info-item">
                <span class="label">Year</span>
                <div class="value">{{ user[3] }}</div>
            </div>

            <div class="info-item">
                <span class="label">Skills</span>
                <div class="value">{{ user[4] or "Not added" }}</div>
            </div>

            <div class="info-item full-width">
                <span class="label">Interests</span>
                <div class="value">{{ user[5] or "Not added" }}</div>
            </div>

            <div class="info-item full-width">
                <span class="label">Bio</span>
                <div class="value">{{ user[6] or "Not added" }}</div>
            </div>
        </div>

        <div class="button-group">
            <a href="/edit-profile" class="edit-btn">✏️ Edit Profile</a>
            <a href="/dashboard" class="back-btn">← Back to Dashboard</a>
        </div>
    </div>
</div>

</body>
</html>
