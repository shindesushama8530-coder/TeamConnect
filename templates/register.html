<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - TeamConnect</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7ff;
            color: #1f2937;
        }

        .container {
            width: 420px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;

            background: #4f46e5;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;

            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Create Account</h1>

        <form method="POST">

            <div class="form-group">

                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="department">Department</label>

                <input
                    type="text"
                    id="department"
                    name="department"
                    placeholder="Example: Computer Science"
                    required
                >

            </div>


            <div class="form-group">

                <label for="year">Year</label>

                <input
                    type="text"
                    id="year"
                    name="year"
                    placeholder="Example: T.Y. B.Tech"
                    required
                >

            </div>


            <div class="form-group">

                <label for="skills">Skills</label>

                <input
                    type="text"
                    id="skills"
                    name="skills"
                    placeholder="Example: Python, Flask, Java"
                >

            </div>


            <button type="submit">
                Register
            </button>

        </form>


        <a href="/" class="home">
            ← Back to Home
        </a>

    </div>

</body>

</html>
